[alembic]
# Explicit migration bootstrap path.  Production/user databases are never
# created or upgraded implicitly; see migrations/env.py for override options
# (-x db_url=..., MOTIONFORGE_DATABASE_URL).  This value only matters when an
# operator explicitly runs `alembic upgrade head`.
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is intentionally NOT set: migrations refuse to run without an
# explicit database target (see migrations/env.py:_database_url).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
