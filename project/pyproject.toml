[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "motionforge"
version = "0.2.0"
description = "MotionForge 2D - Local-first 2D animation motion extraction and replacement"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "aiosqlite==0.22.1",
    "opencv-python-headless==5.0.0.93",
    "numpy==2.4.4",
    "Pillow==12.2.0",
    "scenedetect==0.7.1",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "hydra-core==1.3.4",
    "omegaconf==2.3.1",
    "iopath==0.1.10",
    "tqdm==4.69.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.0",
    "mypy==1.16.1",
]
sam2 = [
    "SAM-2>=1.0",
]
dubbing = [
    "edge-tts>=7.0",
    "openai-whisper>=20240601",
    "deep-translator>=1.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = [
    "UP042",   # Use StrEnum — Pydantic compatibility with str+Enum
    "TC001",   # Move import to TYPE_CHECKING block — runtime imports needed
    "TC002",   # Move third-party import to TYPE_CHECKING block
    "TC003",   # Move stdlib import to TYPE_CHECKING block
    "N806",    # Variable name convention — M for moments is standard
    "B905",    # zip() without strict= — too noisy for spike code
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require GPU, FFmpeg)",
    "gpu: marks tests requiring CUDA GPU",
    "sam2: marks tests requiring SAM2 checkpoint",
    "slow: marks tests as slow",
]
